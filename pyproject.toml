[project]
name = "aria"
version = "0.1.0"
description = "ARIA — Adaptive Resource & Intelligence Agent. A personal AI assistant powered by the Claude Agent SDK."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "claude-agent-sdk>=0.2.87",
  "python-dotenv>=1.0",
  "rich>=13",
  "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aria = "aria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria"]

[tool.hatch.build.targets.wheel.force-include]
"aria/prompts/system.md" = "aria/prompts/system.md"
